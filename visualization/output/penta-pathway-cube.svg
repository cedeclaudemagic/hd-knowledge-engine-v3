<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <defs>
    <!-- Gradients -->
    <linearGradient id="anchorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:0.8" />
    </linearGradient>

    <linearGradient id="gate31Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#8800ff;stop-opacity:0.9" />
    </linearGradient>

    <!-- Glow filter for Thunder -->
    <filter id="thunderGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff00ff"/>
    </marker>
  </defs>

  <style>
    .cube-edge { stroke: #666; stroke-width: 1; fill: none; opacity: 0.4; }
    .penta-edge { stroke: #4488ff; stroke-width: 3; fill: none; opacity: 0.7; }
    .anchor-edge { stroke: url(#anchorGradient); stroke-width: 4; fill: none; }
    .space-diagonal { stroke: url(#gate31Gradient); stroke-width: 5; fill: none; }
    .vertex-label { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; fill: #333; }
    .gate-label { font-family: 'Courier New', monospace; font-size: 10px; fill: #666; }
    .title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #333; }
    .subtitle { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; fill: #666; }
    .legend-text { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11px; fill: #333; }
    .symbol { font-size: 18px; }
  </style>

  <!-- Background -->
  <rect width="800" height="700" fill="#fafafa"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">PENTA PATHWAY TOPOLOGY</text>
  <text x="400" y="55" text-anchor="middle" class="subtitle">The Scalene Anchor Triangle and Centre-Piercing Axis</text>

  <!-- Cube edges (background) -->
  <line x1="400.0" y1="350.0" x2="270.1" y2="425.0" class="cube-edge"/>
  <line x1="400.0" y1="350.0" x2="400.0" y2="200.0" class="cube-edge"/>
  <line x1="400.0" y1="350.0" x2="529.9" y2="425.0" class="cube-edge"/>
  <line x1="270.1" y1="425.0" x2="270.1" y2="275.0" class="cube-edge"/>
  <line x1="270.1" y1="425.0" x2="400.0" y2="500.0" class="cube-edge"/>
  <line x1="400.0" y1="200.0" x2="270.1" y2="275.0" class="cube-edge"/>
  <line x1="400.0" y1="200.0" x2="529.9" y2="275.0" class="cube-edge"/>
  <line x1="529.9" y1="425.0" x2="400.0" y2="500.0" class="cube-edge"/>
  <line x1="529.9" y1="425.0" x2="529.9" y2="275.0" class="cube-edge"/>
  <line x1="270.1" y1="275.0" x2="400.0" y2="350.0" class="cube-edge"/>
  <line x1="400.0" y1="500.0" x2="400.0" y2="350.0" class="cube-edge"/>
  <line x1="529.9" y1="275.0" x2="400.0" y2="350.0" class="cube-edge"/>

  <!-- Penta edges -->
  <line x1="400.0" y1="350.0" x2="400.0" y2="200.0" class="penta-edge"/>
  <line x1="400.0" y1="200.0" x2="400.0" y2="350.0" class="penta-edge"/>
  <line x1="400.0" y1="350.0" x2="400.0" y2="500.0" class="penta-edge"/>
  <line x1="400.0" y1="500.0" x2="400.0" y2="350.0" class="penta-edge"/>
  <line x1="400.0" y1="350.0" x2="270.1" y2="425.0" class="penta-edge"/>

  <!-- Face diagonals -->
  <line x1="400.0" y1="200.0" x2="400.0" y2="350.0" stroke="#44cc88" stroke-width="2.5" stroke-dasharray="8,4" opacity="0.8"/>
  <line x1="400.0" y1="350.0" x2="270.1" y2="425.0" stroke="#44cc88" stroke-width="2.5" stroke-dasharray="8,4" opacity="0.8"/>
  <line x1="400.0" y1="350.0" x2="270.1" y2="275.0" stroke="#44cc88" stroke-width="2.5" stroke-dasharray="8,4" opacity="0.8"/>

  <!-- Scalene Anchor Triangle -->
  <polygon points="400.0,350.0 400.0,350.0 400.0,200.0" fill="url(#anchorGradient)" opacity="0.2"/>
  <line x1="400.0" y1="350.0" x2="400.0" y2="350.0" class="anchor-edge"/>
  <line x1="400.0" y1="350.0" x2="400.0" y2="200.0" class="anchor-edge"/>
  <line x1="400.0" y1="200.0" x2="400.0" y2="350.0" class="anchor-edge"/>
  <text x="375" y="350" class="gate-label" fill="#ff8c00">√3</text>
  <text x="380" y="280" class="gate-label" fill="#ff8c00">1</text>
  <text x="405" y="275" class="gate-label" fill="#ff8c00">√2</text>

  <!-- Gate 31: Space Diagonal through Centre -->
  <line x1="529.9" y1="275.0" x2="270.1" y2="425.0" class="space-diagonal" marker-end="url(#arrowhead)"/>
  <circle cx="400.0" cy="350.0" r="8" fill="#ff00ff" opacity="0.6">
    <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400.0" cy="350.0" r="4" fill="#ffffff"/>
  <text x="415" y="354" class="gate-label" fill="#8800ff">Gate 31</text>
  <text x="415" y="366" class="gate-label" fill="#8800ff">(0.5,0.5,0.5)</text>

  <!-- Trigram Vertices -->
  <circle cx="529.9" cy="425.0" r="20" fill="#ff4444" stroke="#ff0000" stroke-width="3" filter="url(#thunderGlow)"/>
  <text x="529.9" y="425.04" text-anchor="middle" class="symbol" fill="white">☳</text>
  <text x="529.9" y="463" text-anchor="middle" class="vertex-label">Thunder</text>
  <text x="529.9" y="475" text-anchor="middle" class="gate-label">(100) · 0</text>
  <circle cx="270.1" cy="275.0" r="14" fill="#888888" stroke="#fff" stroke-width="2"/>
  <text x="270.1" y="275.04" text-anchor="middle" class="symbol" fill="white">☴</text>
  <text x="270.1" y="253" text-anchor="middle" class="vertex-label">Wind</text>
  <text x="270.1" y="265" text-anchor="middle" class="gate-label">(011) · 1</text>
  <circle cx="529.9" cy="275.0" r="14" fill="#888888" stroke="#fff" stroke-width="2"/>
  <text x="529.9" y="275.04" text-anchor="middle" class="symbol" fill="white">☱</text>
  <text x="529.9" y="253" text-anchor="middle" class="vertex-label">Lake</text>
  <text x="529.9" y="265" text-anchor="middle" class="gate-label">(110) · 1</text>
  <circle cx="400.0" cy="500.0" r="16" fill="#888888" stroke="#fff" stroke-width="2"/>
  <text x="400.0" y="500.04" text-anchor="middle" class="symbol" fill="white">☲</text>
  <text x="400.0" y="534" text-anchor="middle" class="vertex-label">Fire</text>
  <text x="400.0" y="546" text-anchor="middle" class="gate-label">(101) · 2</text>
  <circle cx="270.1" cy="425.0" r="18" fill="#44cc88" stroke="#fff" stroke-width="2"/>
  <text x="270.1" y="425.04" text-anchor="middle" class="symbol" fill="white">☶</text>
  <text x="270.1" y="461" text-anchor="middle" class="vertex-label">Mountain</text>
  <text x="270.1" y="473" text-anchor="middle" class="gate-label">(001) · 3</text>
  <circle cx="400.0" cy="200.0" r="22" fill="#4488ff" stroke="#ffd700" stroke-width="3"/>
  <text x="400.0" y="200.04" text-anchor="middle" class="symbol" fill="white">☵</text>
  <text x="400.0" y="170" text-anchor="middle" class="vertex-label">Water</text>
  <text x="400.0" y="182" text-anchor="middle" class="gate-label">(010) · 5</text>
  <circle cx="400.0" cy="350.0" r="24" fill="#4488ff" stroke="#ffd700" stroke-width="3"/>
  <text x="400.0" y="350.04" text-anchor="middle" class="symbol" fill="white">☷</text>
  <text x="400.0" y="392" text-anchor="middle" class="vertex-label">Earth</text>
  <text x="400.0" y="404" text-anchor="middle" class="gate-label">(000) · 6</text>
  <circle cx="400.0" cy="350.0" r="24" fill="#4488ff" stroke="#ffd700" stroke-width="3"/>
  <text x="400.0" y="350.04" text-anchor="middle" class="symbol" fill="white">☰</text>
  <text x="400.0" y="392" text-anchor="middle" class="vertex-label">Heaven</text>
  <text x="400.0" y="404" text-anchor="middle" class="gate-label">(111) · 6</text>

  <!-- Legend -->
  <rect x="20" y="530" width="220" height="130" fill="white" stroke="#ccc" rx="5"/>
  <text x="30" y="550" class="legend-text" font-weight="bold">LEGEND</text>
  <circle cx="40" cy="572" r="10" fill="#4488ff"/>
  <text x="60" y="576" class="legend-text">High contact (5-6)</text>
  <circle cx="40" cy="594" r="8" fill="#44cc88"/>
  <text x="60" y="598" class="legend-text">Medium contact (3)</text>
  <circle cx="40" cy="616" r="6" fill="#888888"/>
  <text x="60" y="620" class="legend-text">Low contact (1-2)</text>
  <circle cx="40" cy="638" r="8" fill="#ff4444" filter="url(#thunderGlow)"/>
  <text x="60" y="642" class="legend-text">Protected (Thunder = 0)</text>
  <rect x="540" y="530" width="220" height="130" fill="white" stroke="#ccc" rx="5"/>
  <text x="550" y="550" class="legend-text" font-weight="bold">PENTA PATHWAY</text>
  <line x1="550" y1="570" x2="580" y2="570" stroke="url(#anchorGradient)" stroke-width="4"/>
  <text x="590" y="574" class="legend-text">Scalene anchor (1,√2,√3)</text>
  <line x1="550" y1="592" x2="580" y2="592" stroke="#4488ff" stroke-width="3"/>
  <text x="590" y="596" class="legend-text">Cube edges (5 gates)</text>
  <line x1="550" y1="614" x2="580" y2="614" stroke="#44cc88" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="590" y="618" class="legend-text">Face diagonals (3 gates)</text>
  <line x1="550" y1="636" x2="580" y2="636" stroke="url(#gate31Gradient)" stroke-width="5"/>
  <text x="590" y="640" class="legend-text">Gate 31 through centre</text>

  <text x="400" y="685" text-anchor="middle" class="subtitle">Vertex size = contact frequency · Golden outline = anchor vertices · Red glow = protected trigram</text>
</svg>